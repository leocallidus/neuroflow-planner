[project]
name = "neuroflow-cloud-backend"
version = "0.1.0"
description = "Cloud sync backend for NeuroFlow Planner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.122.0,<1.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "PyJWT>=2.10.1,<3.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "uvicorn[standard]>=0.38.0,<1.0.0",
]

[dependency-groups]
dev = [
    "alembic>=1.17.2,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[project.scripts]
neuroflow-sync-api = "app.main:run"

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
