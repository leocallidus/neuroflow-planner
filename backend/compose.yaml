services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: neuroflow-sync-postgres
    environment:
      POSTGRES_DB: neuroflow_sync
      POSTGRES_USER: neuroflow
      POSTGRES_PASSWORD: neuroflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroflow -d neuroflow_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroflow-sync-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uv", "run", "neuroflow-sync-api"]

volumes:
  postgres-data:
