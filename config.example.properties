# NeuroFlow Planner Configuration Example
# Safe example file: do NOT store real API keys in this file.

# AI Mode: offline | local | external
ai.mode=offline

# Legacy API settings (kept for compatibility; keep keys empty)
api.key=
api.model=deepseek-chat
api.url=https://api.artemox.com/v1

# Local Ollama settings
local.ollama.baseUrl=http://localhost:11434
local.ollama.model=llama3

# External OpenAI-compatible API settings
external.api.baseUrl=https://api.artemox.com/v1
external.api.key=
external.api.model=deepseek-chat
external.api.customModels=

# Image generation settings (external mode only)
external.image.model=nano-banana
external.image.customModels=
external.image.size=auto
external.image.aspect_ratio=1:1
external.image.resolution=1K

# AI Assistant settings
ai.assistant.detail=brief
ai.assistant.tone=friendly
ai.assistant.reasoningEffort=medium

# AI request orchestration (anti-timeout)
# Per-attempt HTTP timeouts
ai.request.connectTimeoutMs=10000
ai.request.readTimeoutMs=60000
# Global request budget for retries/fallback/continuation
ai.request.totalBudgetMs=180000
# Lifecycle heartbeat for UI updates while request is in progress
ai.request.heartbeatIntervalMs=2500
# Controlled continuation flow
ai.request.continuation.enabled=true
ai.request.continuation.maxSteps=1
ai.request.continuation.minPartialChars=160
# Retry/fallback
ai.retry.maxAttempts=3
ai.retry.baseDelayMs=2000
ai.retry.maxDelayMs=10000
ai.retry.jitterRatio=0.2
ai.concurrent.maxInFlight=5
ai.concurrent.acquireTimeoutMs=5000
ai.fallback.mode.enabled=false
ai.fallback.models=deepseek-chat,gpt-4o-mini,llama-3-8b

# AI JSON parser migration flags
# ai.json.parser.mode: legacy | dual | jackson
ai.json.parser.mode=legacy
# Enable JSON Schema validation in AI parser pipeline
ai.json.schema.validation.enabled=true
# Provider DTO parsing should be forward-compatible by default
ai.json.parser.failOnUnknownProviderProperties=false
# UI autofill DTO parsing should be strict by default
ai.json.parser.failOnUnknownUiProperties=true

# Task dependency storage migration flags
# task.dependencies.mode: legacy | dual | normalized
task.dependencies.mode=normalized

# DB bulk write rollout flags
# db.bulk.writes.mode: legacy | transactional | batched
db.bulk.writes.mode=legacy
# db.bulk.batch.size is used in batched mode, clamped to [50..500]
db.bulk.batch.size=200

# UX interaction preferences
# ux.undo.maxHistory is clamped to [10..1000]
ux.undo.maxHistory=100
# UX preset profile selected by welcome onboarding
ux.layout.preset=obsidian-inspired
# Shortcut profile controls familiar alias mapping
ux.shortcuts.profile=obsidian

# Adaptive layout preferences (always enabled by default UX contract)
# ux.layout.density.mode: comfortable | compact
ux.layout.density.mode=comfortable
# Persisted adaptive layout state (widths are clamped in runtime)
ux.layout.state.leftPanelCollapsed=false
ux.layout.state.rightPanelCollapsed=false
ux.layout.state.leftPanelWidth=260
ux.layout.state.rightPanelWidth=320

# Sidebar navigation preferences
# ux.sidebar.max.quick.items is clamped to [3..20]
ux.sidebar.max.quick.items=8
# ux.sidebar.max.favorites is clamped to [3..30]
ux.sidebar.max.favorites=10
# ux.sidebar.max.recent is clamped to [3..50]
ux.sidebar.max.recent=12
# Persisted sidebar state (__none__ means explicitly empty collection)
ux.sidebar.state.expandedSections=history,main,tools
ux.sidebar.state.favorites=__none__
ux.sidebar.state.recent=__none__

# Legacy image settings (compatibility only)
ai.image.model=nano-banana
ai.image.size=auto
ai.image.aspect_ratio=1:1
ai.image.resolution=1K

# Theme settings
app.theme.dark=false
